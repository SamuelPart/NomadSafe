# NomadSafe — Version Catalog
#
# Regla de este archivo: ninguna versión se escribe "de memoria".
# Cada versión de abajo fue verificada contra el repositorio upstream que la publica:
#
#   * Toolchain base (AGP / Kotlin / KSP / Compose BOM / Hilt / Room / AndroidX)
#     -> replicado de android/nowinandroid, el proyecto de referencia que Google mantiene,
#        porque esas versiones están probadas como compatibles entre sí.
#   * supabase-kt 3.6.0 -> tag 3.6.0 de supabase-community/supabase-kt.
#     Se elige 3.6.0 (compilado con Kotlin 2.3.21) y NO 3.8.0 (compilado con Kotlin 2.4.0)
#     porque el binario de una librería sólo es legible por un compilador del mismo minor.
#     Kotlin 2.3.0 lee metadata 2.3.x; no leería metadata 2.4.x.
#   * Mapbox 11.33.0 -> tags de mapbox/mapbox-maps-android.
#   * Vosk 0.3.75 + JNA 5.18.1 -> alphacep/vosk-android-demo/app/build.gradle.
#   * Firebase BoM 33.7.0 / gms plugin 4.4.4 -> nowinandroid. Se usan en la integración FCM
#     de Fase 2 (ver docs/PUSH_NOTIFICATIONS.md); el scaffold compila sin ellas.
#
# Al subir Kotlin, subir en el mismo commit: kotlin, ksp, compose plugin y supabase-kt.

[versions]
# --- Toolchain (conjunto verificado en nowinandroid) ---
agp = "9.3.2"
androidTools = "32.3.2"
kotlin = "2.3.0"
ksp = "2.3.4"
# No se usa desugar_jdk_libs: con minSdk 26 java.time es nativo y supabase-kt
# no requiere desugaring (sólo lo pide para minSdk < 26).

# --- DI / persistencia ---
hilt = "2.59"
hiltExt = "1.2.0"
room = "2.8.3"
datastore = "1.2.0"

# --- UI ---
composeBom = "2025.09.01"
androidxCore = "1.15.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.10.0"
androidxNavigation = "2.8.5"
androidxSplashscreen = "1.0.1"
androidxWork = "2.10.0"
accompanist = "0.37.0"

# --- KotlinX ---
coroutines = "1.10.1"
serializationJson = "1.8.0"
datetime = "0.6.1"

# --- Backend: Supabase ---
supabase = "3.6.0"
ktor = "3.4.3"

# --- Mapas ---
mapbox = "1.33.0"

# --- Voz offline (detección de palabras de pánico) ---
vosk = "0.3.75"
jna = "5.18.1"

# --- Ubicación ---
playServicesLocation = "21.3.0"

# --- Push (Fase 2) ---
firebaseBom = "33.7.0"
gmsPlugin = "4.4.4"

# --- Tests ---
junit4 = "4.13.2"
truth = "1.4.4"
turbine = "1.2.0"
androidxTestExt = "1.2.1"

[libraries]
# AndroidX núcleo
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
hilt-ext-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }
hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }

# Compose (versiones gestionadas por el BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Permisos en Compose
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
# Necesario por KSP + Hilt (ver HiltConventionPlugin de nowinandroid).
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# KotlinX
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }

# Supabase (cliente KMP; group io.github.jan-tennert.supabase)
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
# Motor HTTP de Ktor. supabase-kt hace que su androidMain dependa de jvmMain y
# documenta CIO como engine para esos targets (no OkHttp). Se declara la misma
# línea de versión que usa supabase-kt para evitar conflictos de resolución.
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }

# Mapbox Maps SDK v11. Trae mapbox-sdk-geojson como dependencia `api`,
# por eso no se declara geojson/turf aquí (evita conflictos de versión).
mapbox-maps-android = { group = "com.mapbox.maps", name = "android", version.ref = "mapbox" }

# Vosk: reconocimiento de voz 100% offline (Apache-2.0).
# El `@aar` replica la declaración del demo oficial y evita resolver JNA como .jar.
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

# Ubicación
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# Firebase (Fase 2 — push FCM; no se resuelven si nomadsafe.enableFcm=false)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Tests
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
    "androidx-compose-foundation",
]
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]
supabase = [
    "supabase-postgrest",
    "supabase-auth",
    "supabase-realtime",
    "supabase-storage",
    "supabase-functions",
]
coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-play-services",
]
unit-test = [
    "junit4",
    "truth",
    "turbine",
    "kotlinx-coroutines-test",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 incluye soporte de Kotlin integrado: NO se aplica `org.jetbrains.kotlin.android`.
# Sólo se aplican los plugins de lenguaje que extienden ese soporte integrado.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
# Aplicado de forma condicional sólo cuando existe app/google-services.json.
gms = { id = "com.google.gms.google-services", version.ref = "gmsPlugin" }

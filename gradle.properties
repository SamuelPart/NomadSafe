# ─────────────────────────────────────────────────────────────────────────────
# NomadSafe — Gradle properties
# ─────────────────────────────────────────────────────────────────────────────

# JVM del daemon Gradle. 4 GB es lo que usa nowinandroid; con menos, KSP + Hilt + R8
# sobre un proyecto Compose tienden a morir con OutOfMemoryError.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 \
  -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g -Xms1g

kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:ReservedCodeCacheSize=320m \
  -XX:+HeapDumpOnOutOfMemoryError -Xmx3g -Xms1g

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache e isolated projects quedan APAGADOS a propósito.
# Ambos son incubantes y hoy rompen con plugins de terceros que usamos
# (Mapbox, Vosk/JNA, Hilt con KSP). Se pueden activar más adelante midiendo:
#   org.gradle.configuration-cache=true
#   org.gradle.isolated-projects=true
org.gradle.configuration-cache=false
org.gradle.isolated-projects=false

android.useAndroidX=true
kotlin.code.style=official

# AGP 9: apagar build features que no usamos acelera cada build.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ── Secrets ──────────────────────────────────────────────────────────────────
# No poner NUNCA tokens reales en este archivo (está versionado).
# Van en local.properties (ignorado por git) o en ~/.gradle/gradle.properties.
# Ver docs/SETUP.md.

# ── Flags de feature a nivel de build ────────────────────────────────────────
# FCM (push de Firebase) está apagado por defecto para que el proyecto compile y
# corra sin google-services.json. El canal de tiempo real principal es Supabase
# Realtime, que sí funciona en el scaffold. Para encender FCM:
#   1. dejá app/google-services.json en su lugar,
#   2. poné nomadsafe.enableFcm=true,
#   3. seguí docs/PUSH_NOTIFICATIONS.md para agregar los archivos de src/fcm.
nomadsafe.enableFcm=false

# Vosk: si está en true, el modelo de voz se empaqueta en assets/ (APK ~+40 MB pero
# funciona sin descargar nada). En false, el modelo se descarga al primer arranque
# del Modo Escolta. Ver docs/OFFLINE_VOICE.md.
nomadsafe.bundleVoskModel=false
